<!doctype html>
<meta charset="utf-8">
<title>docsvc console</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem;
         background:#0f1115; color:#e6e6e6; }
  h1 { font-size: 1.2rem; } h2 { font-size: .95rem; color:#9aa4b2; margin:1.4rem 0 .4rem; }
  input, textarea, select, button { font: inherit; padding:.4rem .5rem; border-radius:6px;
         border:1px solid #333; background:#1a1d24; color:#e6e6e6; }
  button { background:#2d6cdf; border-color:#2d6cdf; cursor:pointer; }
  button:hover { background:#2559b8; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin:.3rem 0; }
  textarea { width:100%; min-height:60px; }
  pre { background:#000; padding:.6rem; border-radius:6px; overflow:auto; white-space:pre-wrap; }
  .pill { padding:.15rem .5rem; border-radius:999px; background:#1a1d24; border:1px solid #333; }
</style>

<h1>docsvc console</h1>
<div class="row">
  API <input id="api" value="http://localhost:8000" style="flex:1">
  <span id="who" class="pill">not logged in</span>
</div>

<h2>1 · login (dev)</h2>
<div class="row">
  <select id="user"><option>alice</option><option>bob</option><option>carol</option></select>
  <button onclick="login()">login</button>
</div>

<h2>2 · create</h2>
<div class="row">
  <select id="cls"><option>public</option><option selected>internal</option>
    <option>confidential</option><option>secret</option></select>
</div>
<textarea id="content">hello from the console</textarea>
<div class="row"><button onclick="create()">create document</button>
  <span>id: <b id="docid">—</b></span></div>

<h2>3 · read / update / versions</h2>
<div class="row">
  <input id="rid" placeholder="doc id" size="18">
  <button onclick="read()">read latest</button>
  <button onclick="update()">update (new version)</button>
  <button onclick="versions()">list versions</button>
</div>

<h2>4 · ask the AI</h2>
<div class="row">
  <input id="q" placeholder="question about the doc" style="flex:1">
  <button onclick="ask()">ask</button>
</div>

<h2>output</h2>
<pre id="out">—</pre>

<script>
let token = null;
const $ = id => document.getElementById(id);
const base = () => $("api").value.replace(/\/$/, "");
const show = x => $("out").textContent = typeof x === "string" ? x : JSON.stringify(x, null, 2);

async function call(method, path, body) {
  const r = await fetch(base() + path, {
    method,
    headers: { "content-type": "application/json",
               ...(token ? { authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.detail || r.status), { data });
  return data;
}
const run = fn => fn().catch(e => show("ERROR: " + e.message));

function login()   { run(async () => {
  const d = await call("POST", "/auth/login", { username: $("user").value });
  token = d.token; $("who").textContent = d.user + " [" + d.roles.join(",") + "]"; show(d);
}); }
function create()  { run(async () => {
  const d = await call("POST", "/documents",
    { content: $("content").value, classification: $("cls").value });
  $("docid").textContent = d.id; $("rid").value = d.id; show(d);
}); }
function read()     { run(async () => show(await call("GET", "/documents/" + $("rid").value))); }
function update()   { run(async () => show(await call("PUT", "/documents/" + $("rid").value,
                        { content: $("content").value }))); }
function versions() { run(async () => show(await call("GET",
                        "/documents/" + $("rid").value + "/versions"))); }
function ask()      { run(async () => show(await call("POST",
                        "/documents/" + $("rid").value + "/ask", { question: $("q").value }))); }
</script>
